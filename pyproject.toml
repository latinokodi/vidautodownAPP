[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidautodown"
version = "0.1.1"
description = "Simple GUI video downloader built on yt-dlp and CustomTkinter"
requires-python = ">=3.10"
dependencies = [
  "customtkinter>=5.2.2",
  "yt-dlp>=2024.04.09",
]

[tool.setuptools.packages.find]
where = ["src"]
